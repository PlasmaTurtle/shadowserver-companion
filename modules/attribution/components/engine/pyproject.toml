[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach-attribution"
version = "0.2.8"
description = "Standalone, evidence-preserving IP attribution for notification workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.28.1,<0.29", "idna>=3.10,<4", "dnspython>=2.9.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
attribution = "attribution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

