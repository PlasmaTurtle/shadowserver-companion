name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
    steps:
      # Release integrity compares source bytes with bundled wheels. Do not let
      # Windows Git rewrite line endings while populating the checkout.
      - name: Preserve source bytes during checkout
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify bundled dependency integrity
        run: python tools/check_dependencies.py --output dependency-integrity.json
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend development dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and OS dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run complete synthetic verification
        run: python tools/verify.py --report verification.json
      - name: Retain verification summaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ matrix.os }}
          path: |
            verification.json
            dependency-integrity.json
          if-no-files-found: ignore
          retention-days: 14
