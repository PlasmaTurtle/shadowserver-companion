name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
    steps:
      # Release integrity compares source bytes with bundled wheels. Do not let
      # Windows Git rewrite line endings while populating the checkout.
      - name: Preserve source bytes during checkout
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify bundled dependency integrity
        run: python tools/check_dependencies.py --output dependency-integrity.json
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install frontend development dependencies
        run: npm ci --ignore-scripts
      - name: Run fast source checks before browser setup
        run: python tools/verify.py --skip-backend --skip-browser --report verification-preflight.json
      - name: Install PDF test utilities (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install PDF test utilities (Windows)
        if: runner.os == 'Windows'
        run: choco install poppler --yes --no-progress
      - name: Verify PDF test utilities are on PATH
        run: >-
          python -c "import shutil; required = ('pdftotext', 'pdftoppm', 'pdffonts', 'pdfinfo');
          missing = [name for name in required if not shutil.which(name)];
          assert not missing, 'Install Poppler and add its bin directory to PATH: ' + ', '.join(missing)"
      - name: Install Chromium and OS dependencies
        run: npx --no-install playwright install --with-deps chromium
      # Ubuntu restricts user namespaces for downloaded browser builds. Scope
      # the exception to this pinned Playwright executable, keeping its sandbox.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Configure sandboxed Chromium (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          browser_path="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          test -x "$browser_path"
          cat <<EOF | sudo tee /etc/apparmor.d/playwright-chromium
          abi <abi/4.0>,
          include <tunables/global>
          profile playwright-chromium "$browser_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/playwright-chromium
          echo "CHROMIUM_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
      - name: Run complete synthetic verification
        run: python tools/verify.py --report verification.json
      - name: Retain verification summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: |
            verification-preflight.json
            verification.json
            dependency-integrity.json
          if-no-files-found: ignore
          retention-days: 14
