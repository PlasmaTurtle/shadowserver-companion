name: Dependency security

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security.yml'
      - 'requirements*.txt'
      - 'wheelhouse/**'
      - 'wheelhouse-sha256.json'
      - 'components/attribution/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/check_dependencies.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security.yml'
      - 'requirements*.txt'
      - 'wheelhouse/**'
      - 'wheelhouse-sha256.json'
      - 'components/attribution/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/check_dependencies.py'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-advisories:
    name: Python dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install advisory client
        run: python -m pip install pip-audit==2.10.1
      # The existing gate checks the exact bundled versions, including Windows
      # wheels. It submits only public package names and versions, not workspaces.
      - name: Audit exact release dependencies
        run: python tools/check_dependencies.py --audit --output dependency-audit.json
      - name: Retain dependency audit summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14
  npm-advisories:
    name: Frontend tooling advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit locked frontend development dependencies
        run: npm audit --package-lock-only --audit-level=high
