name: Dependency security

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security.yml'
      - 'requirements*.txt'
      - 'wheelhouse/**'
      - 'modules/attribution/components/engine/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/check_dependencies.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security.yml'
      - 'requirements*.txt'
      - 'wheelhouse/**'
      - 'modules/attribution/components/engine/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/check_dependencies.py'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-advisories:
    name: Python dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install advisory client
        run: python -m pip install pip-audit==2.10.1
      # The existing gate checks the exact bundled versions, including Windows
      # wheels. It submits only public package names and versions, not workspaces.
      - name: Audit exact release dependencies
        run: python tools/check_dependencies.py --audit --output dependency-audit.json
      - name: Retain dependency audit summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14
  npm-advisories:
    name: Frontend tooling advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit locked frontend development dependencies
        run: npm audit --package-lock-only --audit-level=high
